name: Build and deploy x-customer-service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: github-x-sharedlib
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - uses: actions/checkout@v4
        with:
          repository: VathanaProgrammer/x-sharedlib
          path: x-sharedlib

      - name: Install shared library
        run: mvn --batch-mode --no-transfer-progress -DskipTests install -f x-sharedlib/pom.xml

      - name: Build customer service
        run: mvn --batch-mode --no-transfer-progress verify

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/vathanaprogrammer/x-customer-service:main
            ghcr.io/vathanaprogrammer/x-customer-service:${{ github.sha }}

      - name: Allow the k3s server to pull the image
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh api --method PATCH
          /user/packages/container/x-customer-service/visibility
          -f visibility=public

      - name: Deploy to k3s
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.K3S_DEPLOY_HOST }}
          username: ${{ secrets.K3S_DEPLOY_USER }}
          key: ${{ secrets.K3S_SSH_KEY }}
          script: |
            set -eu
            IMAGE="ghcr.io/vathanaprogrammer/x-customer-service:${{ github.sha }}"

            sudo k3s kubectl -n x-platform create deployment x-customer-service \
              --image="$IMAGE" \
              --dry-run=client -o yaml \
              | sudo k3s kubectl apply -f -

            sudo k3s kubectl -n x-platform expose deployment x-customer-service \
              --port=8080 \
              --target-port=8080 \
              --dry-run=client -o yaml \
              | sudo k3s kubectl apply -f -

            sudo k3s kubectl -n x-platform set env deployment/x-customer-service \
              SERVER_PORT=8080 \
              SPRING_PROFILES_ACTIVE=production \
              SPRING_DATASOURCE_URL=jdbc:mysql://mysql.x-platform.svc.cluster.local:3306/x_prod \
              SPRING_JPA_HIBERNATE_DDL_AUTO=update \
              --from=secret/x-app-database

            sudo k3s kubectl -n x-platform set resources deployment/x-customer-service \
              --requests=cpu=50m,memory=128Mi \
              --limits=cpu=500m,memory=512Mi

            sudo k3s kubectl -n x-platform patch deployment/x-customer-service \
              --type=strategic \
              --patch='
                spec:
                  template:
                    spec:
                      containers:
                        - name: x-customer-service
                          startupProbe:
                            tcpSocket:
                              port: 8080
                            periodSeconds: 5
                            failureThreshold: 60
                          readinessProbe:
                            tcpSocket:
                              port: 8080
                            periodSeconds: 5
                            failureThreshold: 3
                          livenessProbe:
                            tcpSocket:
                              port: 8080
                            periodSeconds: 10
                            failureThreshold: 3
              '

            sudo k3s kubectl -n x-platform rollout status \
              deployment/x-customer-service --timeout=300s

            sudo k3s kubectl -n x-platform set env deployment/x-bff \
              SERVICES_CUSTOMER_BASE_URL=http://x-customer-service:8080
            sudo k3s kubectl -n x-platform rollout status \
              deployment/x-bff --timeout=180s

            SMOKE_POD="x-customer-smoke-${{ github.run_id }}"
            sudo k3s kubectl -n x-platform run "$SMOKE_POD" \
              --image=curlimages/curl:8.10.1 \
              --restart=Never \
              --rm -i --quiet \
              --command -- curl --fail --silent --show-error --max-time 15 \
              "http://x-customer-service:8080/api/v1/customers?businessId=1&page=0&size=1" \
              >/dev/null
